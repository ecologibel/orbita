<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/ https://cdnjs.cloudflare.com/ajax/libs/codemirror/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com/ajax/libs/codemirror/ https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="../in-shell.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>focus · orbita</title>
<style>
  /* Pages cross-fade into each other where the browser allows */
  @view-transition { navigation: auto; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, input { font-family: inherit; }
  html, body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
    height: 100%;
  }

  .t-dark {
    --accent:     #7fdbca;
    --bg:         #011627;
    --bg-surface: #01111f;
    --border:     #1e3a52;
    --done:       #2f5d69;
    --fg:         #d6deeb;
    --fg-muted:   #6c7a89;
    --hover:      #012a3f;
    --shadow:     0 4px 22px rgba(0, 0, 0, 0.45);
    --tint:       rgba(127, 219, 202, 0.1);
    --glow:       rgba(127, 219, 202, 0.55);
    --mark-bg:    color-mix(in srgb, var(--accent) 16%, transparent);
    --code-bg:    rgba(127, 219, 202, 0.08);
    --code-fg:    #f78c6c;
    --panel:      rgba(19, 85, 92, 0.25);
  }
  .t-light {
    --accent:     #0c9e9a;
    --bg:         #ecf2f2;
    --bg-surface: #f6fafa;
    --border:     #a3c4c6;
    --done:       #2f5d69;
    --fg:         #24292e;
    --fg-muted:   #6a737d;
    --hover:      #d9e8ea;
    --shadow:     0 4px 18px rgba(36, 70, 75, 0.14);
    --tint:       rgba(12, 158, 154, 0.1);
    --glow:       rgba(12, 158, 154, 0.4);
    --mark-bg:    color-mix(in srgb, var(--accent) 16%, transparent);
    --code-bg:    rgba(12, 158, 154, 0.08);
    --code-fg:    #c9532b;
    --panel:      #dce7e8;
  }

  #app {
    background: var(--bg);
    color: var(--fg);
    display: flex;
    min-height: 100vh;
  }
  .main-col { flex: 1 1 auto; min-width: 0; padding: 0 20px 140px; }

  /* ---- Settings sidebar: as the dashboard's, resizable and folding to
     a slim strip. It stays while focusing, folded unless opened ---- */
  aside {
    display: flex;
    flex: 0 0 320px;
    flex-direction: column;
    gap: 32px;
    max-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 48px 28px 36px;
    position: sticky;
    top: 0;
    transition: flex-basis 0.25s ease, padding 0.25s ease;
  }
  aside.dragging { transition: none; }
  .aside-wrap { display: flex; flex: none; position: relative; }
  .aside-wrap::before {
    background: var(--border);
    bottom: 38px;
    content: '';
    left: 0;
    position: absolute;
    top: 38px;
    width: 1px;
    z-index: 1;
  }
  .aside-handle {
    bottom: 0;
    cursor: col-resize;
    left: -4px;
    position: absolute;
    top: 0;
    width: 9px;
    z-index: 2;
  }
  .aside-wrap:has(.aside-handle:hover)::before,
  .aside-wrap.resizing::before { background: var(--accent); }
  .fold-btn {
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 0.9375rem;
    height: 24px;
    line-height: 1;
    width: 24px;
  }
  .fold-btn:hover { background: var(--hover); color: var(--accent); }
  .unfold { display: none; left: 6px; position: absolute; top: 44px; }
  aside.folded { flex-basis: 36px !important; padding: 48px 0; }
  aside.folded > * { display: none; }
  aside.folded > .unfold { display: block; }
  @keyframes side-in {
    from { opacity: 0; transform: translateX(12px); }
    to   { opacity: 1; transform: none; }
  }
  aside > div { animation: side-in 0.35s ease 0.08s both; }
  .side-head {
    align-items: last baseline;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 8px;
  }
  .side-title { font-size: 1.25em; font-weight: 600; }

  /* Each group opens and closes with its +/− */
  .set-group { border-bottom: 1px solid var(--border); padding: 4px 0 10px; }
  .set-head {
    align-items: center;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    font: inherit;
    font-weight: 600;
    justify-content: space-between;
    padding: 8px 0;
    text-transform: lowercase;
    width: 100%;
  }
  .set-sign { font-weight: 400; }
  .set-body {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.24s ease;
  }
  .set-group.closed .set-body { grid-template-rows: 0fr; }
  .set-inner { min-height: 0; overflow: hidden; }
  .set-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 10px; }
  .set-opt {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--fg);
    cursor: pointer;
    font: inherit;
    font-size: 0.8438rem;
    padding: 4px 12px;
    text-transform: lowercase;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .set-opt:hover, .set-opt:focus-visible { border-color: var(--accent); outline: none; }
  .set-opt[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  .set-field {
    color: var(--fg-muted);
    display: flex;
    flex-direction: column;
    font-size: 0.8125rem;
    gap: 6px;
    padding-bottom: 6px;
  }
  .set-field input:not([type="range"]) {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font: inherit;
    font-size: 0.9375rem;
    font-variant-numeric: tabular-nums;
    outline: none;
    padding: 6px 10px;
    width: 8em;
  }
  .set-field input:focus { border-color: var(--accent); }
  .set-field input[type="range"] { accent-color: var(--accent); width: 100%; }
  .set-note { color: var(--fg-muted); font-size: 0.7812rem; min-height: 1em; }
  .set-note.error { color: #e06c75; }

  /* Narrow windows: the settings sit below */
  @media (max-width: 900px) {
    #app { flex-direction: column; }
    aside, aside.folded {
      flex-basis: auto !important;
      max-height: none;
      padding: 36px 28px;
      position: static;
    }
    aside.folded > * { display: revert; }
    .aside-wrap { border-top: 1px solid var(--border); }
    .aside-wrap::before, .aside-handle, .fold-btn { display: none; }
  }

  /* Brief colour fade while the mode changes */
  .theme-anim, .theme-anim * {
    transition: background-color 0.25s ease, border-color 0.25s ease,
      color 0.25s ease !important;
  }

  /* Leave focus mode (top left): dim until hovered */
  #leave {
    align-items: center;
    background: none;
    border: none;
    color: var(--fg-muted);
    cursor: pointer;
    display: flex;
    font-size: 0.875rem;
    gap: 6px;
    left: 16px;
    opacity: 0.45;
    padding: 6px 8px;
    position: fixed;
    text-transform: lowercase;
    top: 14px;
    transition: opacity 0.15s, color 0.15s;
    z-index: 10;
  }
  #leave:hover, #leave:focus-visible { color: var(--fg); opacity: 1; }
  #leave svg { flex-shrink: 0; }

  /* Choose another task: the first item in the settings sidebar */
  #switch {
    align-items: center;
    align-self: flex-start;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    font: inherit;
    font-size: 0.875rem;
    gap: 6px;
    margin: -10px 0 6px -6px;
    padding: 4px 6px;
    text-transform: lowercase;
  }
  #switch:hover, #switch:focus-visible { background: var(--hover); outline: none; }
  #switch svg { flex-shrink: 0; }
  #switch[hidden] { display: none; }

  /* The left sidebar shows only while picking a task */
  body.focus-bare #tk-sidebar { display: none; }
  body.has-sidebar.focus-bare { padding-left: 0; }
  /* Leave focus shows only once a task is chosen; while picking, the
     sidebar is there to move elsewhere */
  body:not(.focus-bare) #leave { display: none; }

  /* Widths match every page: 672px, wide halfway to full */
  main {
    margin: 0 auto;
    max-width: 672px;
    padding-top: 8vh;
    transition: max-width 0.25s ease;
  }
  /* No sidebar here, so take off its 60px to match the other pages */
  .width-wide main { max-width: calc(50% + 302px); }
  .width-full main { max-width: calc(100% - 68px); }

  /* Task text size follows the shared size setting */
  /* The focal task is a little larger than the page's base size */
  #app { --task-fs: 1.125rem; }
  section[hidden] { display: none; }
  #focus.picking #panel,
  #focus.picking #c-btns { display: none; }

  /* Pick a task: a rounded button under the timer while picking */
  #c-pick { display: none; }
  #focus.picking #c-pick {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    cursor: pointer;
    display: inline-block;
    font: inherit;
    font-size: 0.875rem;
    margin-top: 6px;
    padding: 5px 16px;
    text-transform: lowercase;
    transition: background 0.15s, color 0.15s;
  }
  #focus.picking #c-pick:hover,
  #focus.picking #c-pick:focus-visible {
    background: color-mix(in srgb, var(--accent) 24%, transparent);
    outline: none;
  }
  /* The search bar glows when pick a task sends the cursor there */
  #pick-input.glow { animation: pick-glow 1.6s ease-out; }
  @keyframes pick-glow {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    35% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 30%, transparent),
      0 0 22px color-mix(in srgb, var(--accent) 45%, transparent); }
    100% { box-shadow: 0 0 0 0 transparent, var(--shadow); }
  }
  @media (prefers-reduced-motion: reduce) {
    #pick-input.glow { animation: none; }
  }
  #picker { margin-top: 0; }

  /* Entrance */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  .rise { animation: rise 0.35s ease both; }

  /* ---- Picker ---- */
  /* As the simple view's prompt: smaller than tasks, completed colour */
  .pick-title {
    align-items: center;
    color: var(--done);
    display: flex;
    font-size: calc(var(--task-fs, 18px) * 0.85);
    font-style: italic;
    gap: 10px;
    margin-bottom: 14px;
  }
  .pick-title svg { flex-shrink: 0; height: 1.1em; width: 1.1em; }
  #pick-input {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    color: var(--fg);
    font-size: 1.0625rem;
    outline: none;
    padding: 12px 16px;
    width: 100%;
  }
  #pick-input:focus { border-color: var(--accent); }
  #pick-input::placeholder { color: var(--fg-muted); }
  .pick-label {
    color: var(--fg-muted);
    font-size: 0.8125rem;
    letter-spacing: 0.04em;
    margin: 22px 4px 6px;
    text-transform: lowercase;
  }
  .pick-row {
    align-items: baseline;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--fg);
    cursor: pointer;
    display: flex;
    font-size: 0.9375rem;
    gap: 10px;
    line-height: 1.4;
    padding: 5px 12px;
    text-align: left;
    width: 100%;
  }
  .pick-row:hover, .pick-row.active {
    background: var(--hover);
    border-color: var(--border);
  }
  .pick-row .pr-text { flex: 1; min-width: 0; }

  .pick-row .pr-src {
    color: var(--fg-muted);
    flex-shrink: 0;
    font-size: 0.8125rem;
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pick-row.add { color: var(--accent); }
  .pick-empty {
    color: var(--fg-muted);
    font-style: italic;
    padding: 8px 12px;
  }

  /* Dates and tags, as in the to dos */
  .date-token, .mention-token { color: var(--accent); }
  .tag-token {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 3px;
    color: var(--accent);
  }

  /* ---- Minutes ---- */
  #minutes {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
    min-height: 38px;
  }
  /* Minute buttons: the notes folder cards' colour, with teal text */
  .min-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    text-transform: lowercase;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .min-btn:hover { border-color: var(--accent); }
  .min-btn {
    color: var(--accent);
    font-size: 0.9375rem;
    font-variant-numeric: tabular-nums;
    min-width: 52px;
    padding: 8px 10px;
  }
  .min-btn.active { background: var(--tint); border-color: var(--accent); }


  /* Every button gives a little when pressed */
  @keyframes press {
    0% { transform: scale(1); }
    35% { transform: scale(0.9); }
    70% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .press { animation: press 0.3s ease; }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: none; }
  }

  /* ---- Focal task ---- */
  #panel {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 22px 24px 16px;
  }
  .focal {
    align-items: flex-start;
    display: flex;
    gap: 12px;
  }
  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 2px solid var(--accent);
    border-radius: 3px;
    cursor: pointer;
    flex-shrink: 0;
    height: 16px;
    position: relative;
    width: 16px;
  }
  input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  input[type="checkbox"]:checked::after {
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    content: '';
    height: 8px;
    left: 3px;
    position: absolute;
    top: 0;
    transform: rotate(45deg);
    width: 4px;
  }
  #focal-done {
    height: 20px;
    margin-top: 6px;
    width: 20px;
  }
  #focal-done:checked::after { height: 10px; left: 5px; top: 1px; width: 5px; }
  #focal-text {
    border-radius: 4px;
    cursor: text;
    flex: 1;
    font-size: 1.375rem;
    font-weight: 600;
    line-height: 1.4;
    margin: -2px -6px;
    min-width: 0;
    outline: none;
    overflow-wrap: anywhere;
    padding: 2px 6px;
    transition: background 0.15s;
    white-space: pre-wrap;
  }
  #focal-text:hover { background: var(--tint); }
  /* Brings the step field back once its + line has been deleted */
  #focal-add {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
    font: inherit;
    font-size: 1.375rem;
    line-height: 1.4;
    margin-left: auto;
    padding: 0 4px;
  }
  #focal-add[hidden] { display: none; }
  #focal-text:focus { background: var(--tint); box-shadow: 0 0 0 1px var(--border); }
  #focal-text code {
    background: var(--code-bg);
    border-radius: 4px;
    color: var(--code-fg);
    font-family: 'Ubuntu Mono', 'Consolas', 'Menlo', monospace;
    font-size: 0.9em;
    padding: 1px 4px;
  }
  #focal-text mark {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 2px;
    color: inherit;
    padding: 0 1px;
  }
  #focal-text a { color: var(--accent); }
  #focal-text mark[data-c="white"] { background: color-mix(in srgb, #FFFFFF 30%, transparent); }
  #focal-text mark[data-c="silver"] { background: color-mix(in srgb, #C5C9CE 30%, transparent); }
  #focal-text mark[data-c="grey"] { background: color-mix(in srgb, #858B93 30%, transparent); }
  #focal-text mark[data-c="charcoal"] { background: color-mix(in srgb, #41464D 30%, transparent); }
  #focal-text mark[data-c="black"] { background: color-mix(in srgb, #202327 30%, transparent); }
  #focal-text mark[data-c="army-green"] { background: color-mix(in srgb, #A4C65A 30%, transparent); }
  #focal-text mark[data-c="emerald"] { background: color-mix(in srgb, #35B98B 30%, transparent); }
  #focal-text mark[data-c="green"] { background: color-mix(in srgb, #36B84A 30%, transparent); }
  #focal-text mark[data-c="lime"] { background: color-mix(in srgb, #91D52E 30%, transparent); }
  #focal-text mark[data-c="chartreuse"] { background: color-mix(in srgb, #C1D62E 30%, transparent); }
  #focal-text mark[data-c="yellow"] { background: color-mix(in srgb, #F0D52E 30%, transparent); }
  #focal-text mark[data-c="gold"] { background: color-mix(in srgb, #E9AD22 30%, transparent); }
  #focal-text mark[data-c="amber"] { background: color-mix(in srgb, #F49A20 30%, transparent); }
  #focal-text mark[data-c="orange"] { background: color-mix(in srgb, #F47721 30%, transparent); }
  #focal-text mark[data-c="tangerine"] { background: color-mix(in srgb, #F05B35 30%, transparent); }
  #focal-text mark[data-c="clay"] { background: color-mix(in srgb, #D18A70 30%, transparent); }
  #focal-text mark[data-c="coral"] { background: color-mix(in srgb, #F05261 30%, transparent); }
  #focal-text mark[data-c="red"] { background: color-mix(in srgb, #E52F42 30%, transparent); }
  #focal-text mark[data-c="burgundy"] { background: color-mix(in srgb, #C65375 30%, transparent); }
  #focal-text mark[data-c="rose"] { background: color-mix(in srgb, #E34D91 30%, transparent); }
  #focal-text mark[data-c="magenta"] { background: color-mix(in srgb, #D62DB5 30%, transparent); }
  #focal-text mark[data-c="orchid"] { background: color-mix(in srgb, #BD45CF 30%, transparent); }
  #focal-text mark[data-c="purple"] { background: color-mix(in srgb, #A16BD0 30%, transparent); }
  #focal-text mark[data-c="violet"] { background: color-mix(in srgb, #A05BE8 30%, transparent); }
  #focal-text mark[data-c="indigo"] { background: color-mix(in srgb, #7778D5 30%, transparent); }
  #focal-text mark[data-c="blue"] { background: color-mix(in srgb, #2379E5 30%, transparent); }
  #focal-text mark[data-c="azure"] { background: color-mix(in srgb, #219FCB 30%, transparent); }
  #focal-text mark[data-c="cyan"] { background: color-mix(in srgb, #20C4D0 30%, transparent); }
  #focal-text mark[data-c="teal"] { background: color-mix(in srgb, #238F91 30%, transparent); }
  #focal-text mark[data-c="sage"] { background: color-mix(in srgb, #91BFA0 30%, transparent); }
  #focal-text mark[data-c="pink"] { background: color-mix(in srgb, #E34D91 30%, transparent); }
  .focal.done #focal-text,
  .focal.done #focal-text span {
    color: var(--done);
    text-decoration: line-through;
  }
  .focal.done #focal-text .date-token { color: var(--accent); }

  /* Ticking the task: a line sweeps across each line of text in turn,
     then the usual strike-through takes over */
  .focal { position: relative; }
  .focal.striking #focal-text,
  .focal.striking #focal-text span { text-decoration: none; }
  .strike-line {
    animation: strike-across 0.35s ease-out both;
    background: var(--done);
    height: 2px;
    pointer-events: none;
    position: absolute;
    transform-origin: left center;
  }
  @keyframes strike-across {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  /* Timer: a ring that drains as time passes, centred, with its
     controls inside, beneath the time */
  .timer {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }
  #ring {
    height: 280px;
    position: relative;
    transition: opacity 0.3s;
    width: 280px;
  }
  .ring-body svg {
    height: 100%;
    overflow: visible;
    transform: rotate(-90deg);
    width: 100%;
  }
  .ring-body circle { fill: none; stroke-width: 6; }
  .ring-track { stroke: var(--tint); }
  #ring-arc {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s linear;
  }
  /* Running: a slow breath and glow */
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 2px var(--glow)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 16px var(--glow)); transform: scale(1.03); }
  }
  #ring.running .ring-body { animation: breathe 3.2s ease-in-out infinite; }
  #ring.paused .ring-body { opacity: 0.55; }
  .ring-body { transition: opacity 0.3s; }

  /* Time's up: three quick pulses */
  @keyframes alarm {
    0%, 100% { transform: scale(1); }
    50% { filter: drop-shadow(0 0 18px var(--glow)); transform: scale(1.07); }
  }
  #ring.expired .ring-body { animation: alarm 0.5s ease-in-out 3; }
  .ring-body { height: 100%; width: 100%; }
  /* The time (or cheer) sits at the centre; the rest hangs beneath */
  .ring-face {
    align-items: center;
    display: flex;
    flex-direction: column;
    inset: 0;
    position: absolute;
  }
  .face-top, .face-below {
    align-items: center;
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    min-height: 0;
  }
  .face-below { position: relative; top: -16px; }
  #c-time {
    color: var(--accent);
    position: relative;
    top: -16px;
    font-size: 4.75rem;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    line-height: 1.1;
  }
  #c-state {
    color: var(--fg-muted);
    font-size: 0.8125rem;
    height: 18px;
    text-transform: lowercase;
  }
  #c-btns {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }

  /* A finished task needs no timer */

  /* Start, pause and reset: round icon buttons inside the ring */
  .ctl {
    align-items: center;
    animation: pop 0.25s ease both;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    height: 42px;
    justify-content: center;
    padding: 0;
    transition: border-color 0.15s, background 0.15s;
    width: 42px;
  }
  .ctl:hover { background: var(--tint); border-color: var(--accent); }
  .ctl svg { height: 18px; width: 18px; }
  .ctl.press { animation: press 0.3s ease; }

  /* ---- Steps ----
     Steps belong to focus mode only. Each row has a teal + (a tick once
     done); the field for the next step sits in the same column, so a
     new step takes its place and a fresh + opens beneath */
  #subs { margin: 8px 0 0 32px; }
  #subs:empty { margin-top: 0; }
  #subs:empty + .add-sub { margin-top: 8px; }
  .sub, .add-sub {
    align-items: center;
    display: flex;
    gap: 10px;
    min-height: 32px;
    padding: 2px 0;
  }
  .sub-mark, .add-sub .plus {
    background: none;
    border: none;
    color: var(--accent);
    flex-shrink: 0;
    font: inherit;
    font-size: 1.0625rem;
    line-height: 1;
    padding: 0;
    text-align: center;
    width: 16px;
  }
  .sub-mark { cursor: pointer; }
  .sub-text, #add-sub {
    background: none;
    border: none;
    color: var(--fg);
    flex: 1;
    font-size: 1.0625rem;
    min-width: 0;
    outline: none;
    padding: 2px 0;
  }
  .sub.done .sub-text { color: var(--done); text-decoration: line-through; }
  .sub-del {
    background: none;
    border: none;
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 1.125rem;
    opacity: 0;
    padding: 0 4px;
    transition: opacity 0.15s;
  }
  .sub:hover .sub-del, .sub:focus-within .sub-del { opacity: 0.6; }
  .sub-del:hover { opacity: 1 !important; }
  #add-sub::placeholder {
    color: var(--fg-muted);
    font-style: italic;
    opacity: 0.55;
  }
  .add-sub[hidden] { display: none; }

  /* ---- Finished: the ring fills and the cheer sits inside ---- */
  /* A glow starts just inside the ring's edge, then grows inwards and
     loses its transparency until it fills the circle (about 2s), then
     breathes */
  @property --glow-in {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 100%;
  }
  #ring-fill { display: none; }
  .ring-body { position: relative; }
  .ring-glow {
    --glow-in: 100%;
    background: radial-gradient(circle closest-side,
      transparent calc(var(--glow-in) - 28%), var(--accent) var(--glow-in));
    border-radius: 50%;
    inset: 4%;
    opacity: 0;
    pointer-events: none;
    position: absolute;
  }
  #ring.finished .ring-glow {
    animation: ring-glow 2s ease-in-out forwards;
  }
  @keyframes ring-glow {
    0% { --glow-in: 100%; opacity: 0.2; }
    100% { --glow-in: 0%; opacity: 1; }
  }
  #ring.finished .ring-body {
    animation: breathe 3.2s ease-in-out 2s infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    #ring.finished .ring-glow { animation: none; --glow-in: 0%; opacity: 1; }
  }
  #c-cheer, #c-back { display: none; }
  #ring.finished #c-time, #ring.finished #c-state,
  #ring.finished #c-btns { display: none; }
  #ring.finished #c-cheer { display: block; }
  #ring.finished .face-main, #ring.finished .face-below {
    animation: rise 0.5s ease 1.7s both;
  }
  #c-cheer {
    color: var(--bg);
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.15;
    max-width: 220px;
    overflow-wrap: anywhere;
    text-align: center;
  }
  #c-back {
    align-items: center;
    background: none;
    border: none;
    color: var(--bg);
    cursor: pointer;
    font-size: 0.875rem;
    gap: 6px;
    margin-top: 10px;
    opacity: 0.6;
    padding: 4px 8px;
    text-transform: lowercase;
    transition: opacity 0.15s;
  }
  #ring.finished #c-back { display: flex; }
  #c-back:hover, #c-back:focus-visible { opacity: 1; outline: none; }
  #focus.is-done #minutes { visibility: hidden; }

  @media (max-width: 600px) {
    main { padding-top: 70px; }
    .focal { flex-wrap: wrap; }
    #ring { height: 240px; width: 240px; }
    #c-time { font-size: 4rem; top: -14px; }
    .face-below { top: -14px; }
    #c-cheer { font-size: 1.75rem; max-width: 190px; }
  }
</style>

<script src="../recovery.js"></script>
<script>
(function () {
  const D = ToolkitDates, F = ToolkitFocus;
  const TODO_KEY  = "todo-data";
  const NOTES_KEY = "notes-data";
  const MINUTES = [5, 10, 15, 20, 30, 45, 60];
  const MORE    = [5, 10, 15, 20, 30, 45, 60];
  const CHEERS = [
    "you diiiid it", "look at you go", "you're on fire 🔥", "bam",
    "nailed it", "aw yeah", "crushed it", "victory is yours",
    "all over it", "right on man", "radical work dude",
    "simply extraordinary", "yaaaaaass queen", "heeeeeell yeeh",
    "too easy", "done and dusted", "smashed it", "boom 💥",
    "chef's kiss", "absolute legend"
  ];

  const app = document.getElementById("app");
  const $ = id => document.getElementById(id);

  function read(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }

  function store(key, value) {
    try { localStorage.setItem(key, value); } catch {}
  }

  const uid = () => Date.now().toString(36)
    + Math.random().toString(36).slice(2, 7);

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Highlight colours from notes: the 30-colour menu, older names mapped
  const noteColour = c => ToolkitSidebar.colourKey(c);

  function safeHref(href) {
    const h = String(href || "").trim();
    if (/^(https?:|mailto:)/i.test(h)) return h;
    if (/^www\./i.test(h)) return "https://" + h;
    return "";
  }

  function htmlText(html) {
    const t = document.createElement("template");
    t.innerHTML = String(html || "").replace(/<br>/g, " ");
    return t.content.textContent;
  }

  // ---- Data ----

  let dateMigrationWarned = false;

  function loadTodos() {
    const dateKeysReady = D.migrateStoredTodoKeys();
    if (!dateKeysReady && !dateMigrationWarned) {
      dateMigrationWarned = true;
      ToolkitSidebar.toast(
        "Date update paused; free browser storage and reload to retry."
      );
    }
    const raw = read(TODO_KEY);
    try {
      let data = JSON.parse(raw);
      const valid = data && typeof data === "object" && !Array.isArray(data)
        && Array.isArray(data.simple)
        && (data.weekly == null || (typeof data.weekly === "object"
          && !Array.isArray(data.weekly)))
        && (data.toggleData == null || (typeof data.toggleData === "object"
          && !Array.isArray(data.toggleData)));
      if (valid) {
        data = ToolkitRecovery.recoverTodos(data, raw, recoveryRaw =>
          ToolkitSidebar.preserveRecovery(TODO_KEY, recoveryRaw));
        if (!data.weekly) data.weekly = {};
        if (!data.toggleData) data.toggleData = {};
        if (dateKeysReady) data.dateKeyVersion = 1;
        let relativeChanged = false;
        lists(data).forEach(([, list]) => (list || []).forEach(task => {
          if (task.text && !task.anchorAt) D.stampAnchor(task);
          if (D.refreshRelativeTask(task)) relativeChanged = true;
        }));
        if (relativeChanged) saveTodos(data);
        return data;
      }
    } catch {}
    if (raw !== null) ToolkitSidebar.preserveRecovery(TODO_KEY, raw);
    return { simple: [], toggleData: {}, weekly: {},
      ...(dateKeysReady ? { dateKeyVersion: 1 } : {}) };
  }

  function saveTodos(data) {
    store(TODO_KEY, JSON.stringify(data));
  }

  function loadNotes() {
    const raw = read(NOTES_KEY);
    try {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.notes)
          && (data.folders == null || Array.isArray(data.folders))) {
        let relativeChanged = false;
        data.notes.forEach(note => (note.blocks || []).forEach(block => {
          if (block.type !== "todo") return;
          const text = htmlText(block.html).trim();
          const refreshed = D.refreshRelativeText(text,
            block.anchorAt || note.updated);
          if (!refreshed) return;
          const html = D.replaceHtmlRange(block.html,
            refreshed.start, refreshed.end, refreshed.token);
          if (html == null) return;
          block.html = html;
          block.anchorAt = refreshed.anchorAt;
          block.anchorTok = D.firstToken(refreshed.text);
          relativeChanged = true;
        }));
        if (relativeChanged) saveNotes(data);
        return data;
      }
    } catch {}
    if (raw !== null) ToolkitSidebar.preserveRecovery(NOTES_KEY, raw);
    return null;
  }

  // Save changed notes; sync.js watches this key and schedules notes.json.
  function saveNotes(data) {
    store(NOTES_KEY, JSON.stringify(data));
  }

  function lists(data) {
    const out = [["simple", data.simple]];
    Object.keys(data.toggleData).forEach(id => {
      out.push(["toggle-" + id, data.toggleData[id]]);
    });
    Object.keys(data.weekly).forEach(k => out.push([k, data.weekly[k]]));
    return out;
  }

  // The focal task, wherever it lives
  function locate(ref) {
    if (!ref) return null;
    if (ref.kind === "todo") {
      const data = loadTodos();
      for (const [src, list] of lists(data)) {
        const i = (list || []).findIndex(t => t.fid === ref.fid);
        if (i >= 0) {
          const task = list[i];
          return { arr: list, data, done: !!task.done, i,
            indent: task.indent || 0, item: task, kind: "todo", src,
            text: task.text };
        }
      }
      return null;
    }
    const notes = loadNotes();
    const note = notes && notes.notes.find(n => n.id === ref.noteId
      && !n.trashed);
    const i = note ? note.blocks.findIndex(b => b.id === ref.blockId) : -1;
    if (i < 0 || note.blocks[i].type !== "todo") return null;
    const b = note.blocks[i];
    return { arr: note.blocks, data: notes, done: !!b.checked, i,
      indent: b.indent || 0, item: b, kind: "note", note,
      text: htmlText(b.html).trim() };
  }

  function save(loc) {
    if (loc.kind === "todo") saveTodos(loc.data);
    else {
      loc.note.updated = Date.now();
      saveNotes(loc.data);
    }
  }

  function setDone(loc, x, done) {
    if (loc.kind === "todo") x.done = done;
    else x.checked = done;
    if (done) x.doneAt = Date.now();
    else delete x.doneAt;
  }

  // ---- Picker ----

  let pickActive = -1, pickRows = [];

  // Every open to do, with its date range
  function candidates() {
    const out = [];
    const data = loadTodos();
    lists(data).forEach(([src, list]) => {
      (list || []).forEach(task => {
        if (!task.text || task.done) return;
        out.push({ anchorAt: task.anchorAt, kind: "todo",
          r: D.taskRange(task, src), task, text: task.text });
      });
    });
    const notes = loadNotes();
    (notes ? notes.notes : []).forEach(n => {
      if (n.trashed || !Array.isArray(n.blocks)) return;
      n.blocks.forEach(b => {
        if (b.type !== "todo" || b.checked) return;
        const text = htmlText(b.html).trim();
        if (!text) return;
        const anchor = D.dayStart(
          new Date(b.anchorAt || n.updated || Date.now()));
        out.push({ anchorAt: b.anchorAt || n.updated, block: b,
          kind: "note", note: n, r: D.textRange(text, anchor), text });
      });
    });
    return out;
  }

  function renderPicker() {
    const q = $("pick-input").value.trim();
    const today = D.dayStart(new Date());
    let rows = candidates();
    if (q) {
      const ql = q.toLowerCase();
      rows = rows.filter(c => c.text.toLowerCase().includes(ql));
    } else {
      rows = rows.filter(c => c.r && c.r.start <= today);
    }
    rows.sort((a, b) => (a.r ? +a.r.start : 9e15) - (b.r ? +b.r.start : 9e15));
    rows = rows.slice(0, 40);
    $("pick-label").textContent = q ? "matching to dos" : "suggested";

    const box = $("pick-list");
    box.innerHTML = "";
    pickRows = [];
    rows.forEach(c => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pick-row";
      btn.innerHTML = '<span class="pr-text">'
        + D.highlight(c.text, c.anchorAt) + "</span>";
      if (c.kind === "note") {
        const src = document.createElement("span");
        src.className = "pr-src";
        src.textContent = "↗ " + ((c.note.title || "").trim() || "untitled");
        btn.appendChild(src);
      }
      btn.addEventListener("click", e => {
        const token = e.target.closest(".date-token");
        if (token) {
          e.preventDefault();
          e.stopPropagation();
          D.openDatePicker(token, replacement => {
            if (c.kind === "todo") {
              const data = loadTodos();
              let task = null;
              lists(data).some(([, list]) => (list || []).some(t => {
                if (c.task.fid ? t.fid === c.task.fid
                  : t.text === c.task.text && !t.done && !t.fid) task = t;
                return !!task;
              }));
              if (!task) return;
              const previous = { anchorAt: task.anchorAt, anchorTok: task.anchorTok,
                text: task.text };
              task.text = D.replaceTextRange(task.text,
                token.dataset.dateStart, token.dataset.dateEnd, replacement);
              D.stampAnchor(task);
              const changedText = task.text, fid = task.fid;
              saveTodos(data);
              renderPicker();
              return () => {
                const latest = loadTodos();
                let target = null;
                lists(latest).some(([, list]) => (list || []).some(t => {
                  if (fid ? t.fid === fid
                    : t.text === changedText && !t.done && !t.fid) target = t;
                  return !!target;
                }));
                if (!target) return;
                target.text = previous.text;
                target.anchorAt = previous.anchorAt;
                target.anchorTok = previous.anchorTok;
                saveTodos(latest);
                renderPicker();
              };
            } else {
              const data = loadNotes();
              const note = data && data.notes.find(n => n.id === c.note.id);
              const block = note && note.blocks.find(b => b.id === c.block.id);
              if (!block) return;
              const previous = { anchorAt: block.anchorAt, anchorTok: block.anchorTok,
                html: block.html, updated: note.updated };
              const html = D.replaceHtmlRange(block.html,
                token.dataset.dateStart, token.dataset.dateEnd, replacement);
              if (html == null) return;
              block.html = html;
              note.updated = Date.now();
              saveNotes(data);
              renderPicker();
              return () => {
                const latest = loadNotes();
                const savedNote = latest && latest.notes.find(n => n.id === c.note.id);
                const savedBlock = savedNote
                  && savedNote.blocks.find(b => b.id === c.block.id);
                if (!savedBlock) return;
                savedBlock.html = previous.html;
                savedBlock.anchorAt = previous.anchorAt;
                savedBlock.anchorTok = previous.anchorTok;
                savedNote.updated = previous.updated;
                saveNotes(latest);
                renderPicker();
              };
            }
          });
          return;
        }
        choose(c);
      });
      box.appendChild(btn);
      pickRows.push({ btn, run: () => choose(c) });
    });
    if (!rows.length && !q) {
      const e = document.createElement("div");
      e.className = "pick-empty";
      e.textContent = "nothing due today. search, or type a new to do.";
      box.appendChild(e);
    }
    if (q) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pick-row add";
      const text = D.firstToken(q) ? q : q + " @today";
      btn.innerHTML = '<span class="pr-text">+ add “' + esc(text)
        + "”</span>";
      btn.addEventListener("click", () => create(q));
      box.appendChild(btn);
      pickRows.push({ btn, run: () => create(q) });
    }

    // Typing a new to do: Enter adds it unless a match is chosen
    pickActive = q ? pickRows.length - 1 : -1;
    markActive();
  }

  function markActive() {
    pickRows.forEach((r, i) => r.btn.classList.toggle("active",
      i === pickActive));
  }

  function choose(c) {
    if (c.kind === "todo") {
      const data = loadTodos();
      let task = null;
      lists(data).some(([, list]) => (list || []).some(t => {
        const same = c.task.fid ? t.fid === c.task.fid
          : t.text === c.task.text && !t.done && !t.fid;
        if (same) task = t;
        return same;
      }));
      if (!task) return;
      if (!task.fid) {
        task.fid = uid();
        saveTodos(data);
      }
      begin({ fid: task.fid, kind: "todo" }, task.text);
    } else {
      begin({ blockId: c.block.id, kind: "note", noteId: c.note.id }, c.text);
    }
  }

  // A new to do for today joins the simple list
  function create(text) {
    const data = loadTodos();
    const task = { done: false, fid: uid(), indent: 0,
      text: D.firstToken(text) ? text : text + " @today" };
    D.stampAnchor(task);
    data.simple = data.simple.filter(t => t.text !== "");
    data.simple.push(task);
    saveTodos(data);
    begin({ fid: task.fid, kind: "todo" }, task.text);
  }

  function begin(ref, text) {
    // Keep the duration or finish time chosen in the settings
    const prev = F.get();
    const next = { minutes: prev.minutes || 10, state: "idle", task: ref, text };
    if (prev.finishAt && prev.finishAt > Date.now()) next.finishAt = prev.finishAt;
    F.set(next);
    $("pick-input").value = "";
    render();
  }

  // Pick a task: put the cursor in the search bar and make it glow
  $("c-pick").addEventListener("click", () => {
    const input = $("pick-input");
    input.focus();
    input.classList.remove("glow");
    void input.offsetWidth;
    input.classList.add("glow");
  });
  $("pick-input").addEventListener("animationend", e => {
    if (e.animationName === "pick-glow") e.target.classList.remove("glow");
  });

  $("pick-input").addEventListener("input", renderPicker);
  $("pick-input").addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!pickRows.length) return;
      const step = e.key === "ArrowDown" ? 1 : -1;
      pickActive = (pickActive + step + pickRows.length) % pickRows.length;
      markActive();
      pickRows[pickActive].btn.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter" && pickRows[pickActive]) {
      e.preventDefault();
      pickRows[pickActive].run();
    }
  });

  // ---- Focal task ----

  let shownSig = "", firstRender = true;

  function render() {
    const s = F.get();
    let loc = locate(s.task);

    // A finished task from last time gives way to the picker
    if (firstRender && loc && loc.done && s.state === "idle") loc = null;
    firstRender = false;
    const picking = !loc;
    document.body.classList.toggle("focus-bare", !picking);
    applySideFold();
    $("picker").hidden = !picking;
    $("focus").hidden = false;
    $("focus").classList.toggle("picking", picking);
    if (picking) $("switch").hidden = true;
    if (picking) {
      if (s.task) {
        s.state = "idle";
        delete s.endAt;
        delete s.remaining;
        delete s.total;
        F.set(s);
      }
      if (shownSig !== "picker") {
        shownSig = "picker";
        $("picker").classList.remove("rise");
        void $("picker").offsetWidth;
        $("picker").classList.add("rise");
      }
      renderClock(s, true);
      $("switch").hidden = true;
      renderPicker();
      $("pick-input").focus();
      ToolkitSidebar.title("focus");
      return;
    }
    if (shownSig !== "focus") {
      shownSig = "focus";
      $("panel").classList.remove("rise");
      void $("panel").offsetWidth;
      $("panel").classList.add("rise");
    }

    // Keep the chip and banner's copy of the text current; the timer
    // starts at 10 minutes
    if (s.text !== loc.text || !s.minutes) {
      s.text = loc.text;
      s.minutes = s.minutes || 10;
      F.set(s);
    }

    if (document.activeElement !== $("focal-text")) showFocal(loc);
    $("focal-done").checked = loc.done;
    document.querySelector(".focal").classList.toggle("done", loc.done);

    // Ticked here: the ring fills and holds a cheer, until 'back to timer'
    const finished = loc.done && finishedFor === stepKey(s.task);
    $("focus").classList.toggle("is-done", finished);
    $("ring").classList.toggle("finished", finished);
    ringFinished = finished;
    ToolkitSidebar.title(loc.text.slice(0, 40), "focus");
    renderSubs();
    renderClock(s, true);
  }

  // ---- Steps ----
  //
  // Breaking a task down happens here only: steps are kept with the
  // task on this device, not added to the to dos or the note

  const STEPS_KEY = "focus-steps";

  // Which task's finished ring is showing (cleared by 'back to timer')
  let finishedFor = null, ringFinished = false;

  function stepKey(ref) {
    return ref.kind === "todo" ? "todo:" + ref.fid
      : "note:" + ref.noteId + ":" + ref.blockId;
  }

  function allSteps() {
    try { return JSON.parse(read(STEPS_KEY)) || {}; } catch { return {}; }
  }

  function getSteps() {
    const ref = F.get().task;
    return ref ? allSteps()[stepKey(ref)] || [] : [];
  }

  function setSteps(list) {
    const ref = F.get().task;
    if (!ref) return;
    const all = allSteps();
    if (list.length) all[stepKey(ref)] = list;
    else delete all[stepKey(ref)];
    store(STEPS_KEY, JSON.stringify(all));
  }

  function renderSubs() {
    const box = $("subs");
    box.innerHTML = "";
    getSteps().forEach((step, k) => {
      const row = document.createElement("div");
      row.className = "sub" + (step.done ? " done" : "");
      const mark = document.createElement("button");
      mark.className = "sub-mark";
      mark.type = "button";
      mark.textContent = step.done ? "✓" : "+";
      mark.title = step.done ? "not done" : "done";
      mark.setAttribute("aria-label", mark.title);
      mark.addEventListener("click", () => {
        const list = getSteps();
        if (!list[k]) return;
        list[k].done = !list[k].done;
        setSteps(list);
        renderSubs();
      });
      const input = document.createElement("input");
      input.className = "sub-text";
      input.value = step.text;
      input.addEventListener("input", () => {
        const list = getSteps();
        if (!list[k]) return;
        list[k].text = input.value;
        setSteps(list);
      });
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          openAddRow();
        } else if (e.key === "Backspace" && input.value === "") {
          e.preventDefault();
          removeStep(k);
        }
      });
      const del = document.createElement("button");
      del.className = "sub-del";
      del.type = "button";
      del.textContent = "×";
      del.title = "delete step";
      del.addEventListener("click", () =>
        ToolkitSidebar.collapse(row).then(() => removeStep(k)));
      row.append(mark, input, del);
      box.appendChild(row);
    });
    $("add-sub").placeholder = box.children.length ? "" : "break it down";
    const closed = addRowClosed();
    $("add-sub-row").hidden = closed;
    $("focal-add").hidden = !closed;
  }

  // Whether this task's + line has been deleted with Backspace
  const CLOSED_KEY = "focus-steps-closed";
  function addRowClosed() {
    const ref = F.get().task;
    try {
      return !!(ref && (JSON.parse(read(CLOSED_KEY)) || {})[stepKey(ref)]);
    } catch { return false; }
  }
  function setAddRowClosed(closed) {
    const ref = F.get().task;
    if (!ref) return;
    let all = {};
    try { all = JSON.parse(read(CLOSED_KEY)) || {}; } catch {}
    if (closed) all[stepKey(ref)] = true;
    else delete all[stepKey(ref)];
    store(CLOSED_KEY, JSON.stringify(all));
  }

  // The cursor goes to the end of the line above: a step, or the task
  function focusLineAbove(k) {
    const rows = $("subs").querySelectorAll(".sub-text");
    const target = k > 0 ? rows[k - 1] : null;
    if (target) {
      target.focus();
      target.setSelectionRange(target.value.length, target.value.length);
      return;
    }
    focalEl.focus();
    const range = document.createRange();
    range.selectNodeContents(focalEl);
    range.collapse(false);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function openAddRow() {
    setAddRowClosed(false);
    renderSubs();
    $("add-sub").focus();
  }

  function removeStep(k) {
    const list = getSteps();
    list.splice(k, 1);
    setSteps(list);
    renderSubs();
    focusLineAbove(k);
  }

  $("focal-add").addEventListener("click", openAddRow);

  // A new step takes the field's place; a fresh + opens beneath.
  // Backspace on the empty field deletes the + line itself.
  $("add-sub").addEventListener("keydown", e => {
    if (e.key === "Backspace" && $("add-sub").value === "") {
      e.preventDefault();
      setAddRowClosed(true);
      renderSubs();
      focusLineAbove(getSteps().length);
      return;
    }
    if (e.key !== "Enter") return;
    e.preventDefault();
    const text = $("add-sub").value.trim();
    if (!text) return;
    const list = getSteps();
    list.push({ done: false, text });
    setSteps(list);
    $("add-sub").value = "";
    renderSubs();
    // The new step grows into place
    const added = $("subs").lastElementChild;
    if (added) ToolkitSidebar.grow(added);
    $("add-sub").focus();
  });

  // Tick the focal task: the timer stops and a cheer comes up
  // Draw a line across each line of the task's text, one after another
  function strikeAcross() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const focal = document.querySelector(".focal");
    const box = focal.getBoundingClientRect();
    const range = document.createRange();
    range.selectNodeContents(focalEl);
    // One rectangle per text line, merging fragments on the same line
    const lines = [];
    Array.from(range.getClientRects()).forEach(r => {
      if (!r.width) return;
      const line = lines.find(l => Math.abs(l.top - r.top) < r.height / 2);
      if (line) {
        line.left = Math.min(line.left, r.left);
        line.right = Math.max(line.right, r.right);
      } else {
        lines.push({ top: r.top, height: r.height, left: r.left, right: r.right });
      }
    });
    if (!lines.length) return;
    focal.classList.add("striking");
    // Each line takes 0.35s, but a long task sweeps faster to finish
    // within about 1.2s
    const step = Math.min(0.35, 1.2 / lines.length);
    lines.forEach((l, i) => {
      const bar = document.createElement("div");
      bar.className = "strike-line";
      bar.style.left = (l.left - box.left) + "px";
      bar.style.top = (l.top - box.top + l.height * 0.55) + "px";
      bar.style.width = (l.right - l.left) + "px";
      bar.style.animationDelay = (i * step) + "s";
      bar.style.animationDuration = step + "s";
      focal.appendChild(bar);
    });
    setTimeout(() => {
      focal.classList.remove("striking");
      focal.querySelectorAll(".strike-line").forEach(b => b.remove());
    }, (lines.length * step) * 1000 + 50);
  }

  $("focal-done").addEventListener("change", () => {
    const loc = locate(F.get().task);
    if (!loc) return;
    const done = $("focal-done").checked;
    if (done) strikeAcross();
    setDone(loc, loc.item, done);
    save(loc);
    const s = F.get();
    if (done && s.state !== "idle") {
      s.state = "idle";
      delete s.endAt;
      delete s.remaining;
      s.bannerOff = true;
      F.set(s);
    }
    if (done) {
      finishedFor = stepKey(F.get().task);
      $("c-cheer").textContent = nextCheer();
    } else {
      finishedFor = null;
    }
    render();
  });

  // Back to the timer for another round; the task stays ticked
  $("c-back").addEventListener("click", () => {
    finishedFor = null;
    render();
  });

  // ---- Editing the focal task ----
  //
  // To dos are plain text, coloured as you type, as in the to dos. A
  // note's to do keeps its formatting, with the notes' shortcuts.

  const focalEl = $("focal-text");
  let focalKind = null, focalBefore = "";

  function showFocal(loc) {
    focalKind = loc.kind;
    focalEl.contentEditable = loc.kind === "todo" ? "plaintext-only" : "true";
    focalEl.innerHTML = loc.kind === "todo" ? D.highlight(loc.text, loc.item.anchorAt)
      : D.decorate(clean(loc.item.html), loc.item.anchorAt || loc.note.updated);
  }

  function selRange() {
    const s = getSelection();
    return s.rangeCount ? s.getRangeAt(0) : null;
  }

  // Characters before the caret
  function caretAt(el) {
    const r = selRange();
    if (!r || !el.contains(r.startContainer)) return null;
    const pre = document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(r.startContainer, r.startOffset);
    return pre.toString().length;
  }

  function setCaret(el, pos) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const r = document.createRange();
    let left = pos, placed = false;
    while (walker.nextNode()) {
      const n = walker.currentNode;
      if (left <= n.length) {
        r.setStart(n, left);
        placed = true;
        break;
      }
      left -= n.length;
    }
    if (!placed) {
      r.selectNodeContents(el);
      r.collapse(false);
    }
    r.collapse(true);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }

  // Keep only the formatting the notes keep
  function clean(html) {
    const t = document.createElement("template");
    t.innerHTML = html;
    const TAGS = { B: "b", STRONG: "b", I: "i", EM: "i", U: "u", S: "s",
      STRIKE: "s", DEL: "s", CODE: "code", MARK: "mark" };
    const walk = node => {
      let out = "";
      node.childNodes.forEach(n => {
        if (n.nodeType === 3) {
          out += esc(n.data.replace(/\u200b/g, ""));
        } else if (n.nodeType === 1) {
          if (n.tagName === "BR") { out += "<br>"; return; }
          const inner = walk(n);
          if (!inner) return;
          if (n.tagName === "A") {
            const href = safeHref(n.getAttribute("href"));
            out += href
              ? '<a href="' + esc(href) + '">' + inner + "</a>" : inner;
            return;
          }
          const tag = TAGS[n.tagName];
          const ck = tag === "mark" && noteColour(n.dataset.c);
          const col = ck ? ' data-c="' + ck + '"' : "";
          out += tag ? "<" + tag + col + ">" + inner + "</" + tag + ">"
            : inner;
        }
      });
      return out;
    };
    return walk(t.content);
  }

  // Save each change where the task lives, then re-colour in place
  function saveFocal() {
    const loc = locate(F.get().task);
    if (!loc) return;
    const pos = caretAt(focalEl);
    if (loc.kind === "todo") {
      const text = focalEl.textContent.replace(/\n/g, " ");
      if (text === loc.item.text) return;
      loc.item.text = text;
      if (text) D.stampAnchor(loc.item);
      save(loc);
      const want = D.highlight(text);
      if (focalEl.innerHTML !== want) {
        focalEl.innerHTML = want;
        if (pos !== null) setCaret(focalEl, pos);
      }
    } else {
      const html = clean(focalEl.innerHTML);
      if (html === loc.item.html) return;
      loc.item.html = html;
      const t = { anchorAt: loc.item.anchorAt,
        anchorTok: loc.item.anchorTok || "", text: focalEl.textContent };
      D.stampAnchor(t);
      loc.item.anchorAt = t.anchorAt;
      loc.item.anchorTok = t.anchorTok;
      save(loc);
      const want = D.decorate(html, loc.item.anchorAt || loc.note.updated);
      if (focalEl.innerHTML !== want) {
        focalEl.innerHTML = want;
        if (pos !== null) setCaret(focalEl, pos);
      }
    }
  }

  // Wrap or unwrap the selection, as Ctrl+E and friends do in notes
  function toggleWrap(tag) {
    const r = selRange();
    if (!r || r.collapsed || !focalEl.contains(r.commonAncestorContainer)) {
      return;
    }
    const node = r.commonAncestorContainer;
    const inTag = (node.nodeType === 1 ? node : node.parentElement)
      .closest(tag);
    const sel = document.createRange();
    if (inTag && focalEl.contains(inTag)) {
      const first = inTag.firstChild, last = inTag.lastChild;
      inTag.replaceWith(...inTag.childNodes);
      sel.setStartBefore(first);
      sel.setEndAfter(last);
    } else {
      const el = document.createElement(tag);
      el.appendChild(r.extractContents());
      el.querySelectorAll(tag).forEach(x => x.replaceWith(...x.childNodes));
      r.insertNode(el);
      sel.selectNodeContents(el);
    }
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(sel);
    saveFocal();
  }

  focalEl.addEventListener("focus", () => {
    focalBefore = focalEl.textContent;
  });
  focalEl.addEventListener("input", saveFocal);
  focalEl.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
    if (e.key === "Enter") {
      e.preventDefault();
      focalEl.blur();
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      focalEl.blur();
      return;
    }
    if (focalKind !== "note") {
      // Plain text: no formatting shortcuts
      if (mod && ["b", "i", "u"].includes(key)) e.preventDefault();
      return;
    }
    const wraps = { e: [false, "code"], h: [true, "mark"], s: [true, "s"] };
    if (mod && wraps[key] && wraps[key][0] === e.shiftKey) {
      e.preventDefault();
      toggleWrap(wraps[key][1]);
    }
  });
  focalEl.addEventListener("paste", e => {
    e.preventDefault();
    const text = e.clipboardData.getData("text/plain").replace(/\s+/g, " ");
    document.execCommand("insertText", false, text);
  });

  // Leaving the text: an emptied task gets its words back
  focalEl.addEventListener("blur", () => {
    if (!focalEl.textContent.trim()) {
      const loc = locate(F.get().task);
      if (loc) {
        if (loc.kind === "todo") loc.item.text = focalBefore;
        else loc.item.html = esc(focalBefore);
        save(loc);
      }
    }
    render();
  });

  // ---- Timer ----

  const PLAY = '<svg viewBox="0 0 24 24" width="13" height="13" '
    + 'fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" width="13" height="13" '
    + 'fill="currentColor"><rect x="6" y="4.5" width="4" height="15" '
    + 'rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';

  const RESET = '<svg viewBox="0 0 24 24" width="14" height="14" '
    + 'fill="none" stroke="currentColor" stroke-width="2.2" '
    + 'stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/>'
    + '<path d="M4.5 4v4.5H9"/></svg>';
  const RING = 2 * Math.PI * 92;

  // A round icon button, named on hover
  function ctl(html, label, fn) {
    const b = document.createElement("button");
    b.className = "ctl";
    b.type = "button";
    b.dataset.ctl = label;
    b.title = label;
    b.setAttribute("aria-label", label);
    b.innerHTML = html;
    b.addEventListener("click", fn);
    return b;
  }

  // The ring, its controls and the minute buttons
  function renderClock(s, force) {
    if ($("focus").hidden) return;
    // Minutes to choose from before starting; time to add once started.
    // The row is rebuilt only when it changes kind, so a pressed button
    // stays put and shows its press
    const mins = $("minutes");
    const kind = s.state === "idle" ? "pick" : "more";
    if (force || kind !== mins.dataset.kind) {
      mins.dataset.kind = kind;
      mins.innerHTML = "";
      if (kind === "more") {
        MORE.forEach(m => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "min-btn more";
          b.textContent = "+" + m;
          b.title = "add " + m + " minutes";
          b.addEventListener("click", () => addTime(m));
          mins.appendChild(b);
        });
      } else {
        MINUTES.forEach(m => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "min-btn";
          b.dataset.m = m;
          b.textContent = m;
          b.title = m + " minutes";
          b.addEventListener("click", () => setMinutes(m));
          mins.appendChild(b);
        });
      }
    }
    if (kind === "pick") {
      mins.querySelectorAll(".min-btn").forEach(b => {
        b.classList.toggle("active", +b.dataset.m === s.minutes);
      });
    }

    // Only the controls that apply; reset whenever time has been used
    if (force || s.state !== renderClock.state) {
      renderClock.state = s.state;
      const btns = $("c-btns");
      btns.innerHTML = "";
      if (s.state === "idle") btns.appendChild(ctl(PLAY, "start", start));
      if (s.state === "paused") btns.appendChild(ctl(PLAY, "resume", start));
      if (s.state === "running") btns.appendChild(ctl(PAUSE, "pause", pause));
      if (s.state !== "idle") btns.appendChild(ctl(RESET, "reset", reset));
    }

    // Added time refills the ring in proportion to the new total
    const chosen = (s.minutes || 10) * 60000;
    const total = s.state === "idle" ? chosen : s.total || chosen;
    const left = s.state === "idle" ? total : F.left(s);
    $("c-time").textContent = F.clock(left);
    $("c-state").textContent = s.state === "paused" ? "paused"
      : s.state === "expired" ? "time's up" : "";
    const frac = Math.min(1, left / total);
    $("ring-arc").style.strokeDasharray = RING;
    $("ring-arc").style.strokeDashoffset = RING * (1 - frac);
    $("ring").className = s.state + (ringFinished ? " finished" : "");
    // No other task to switch to while still picking one
    $("switch").hidden = s.state === "running" || s.state === "paused"
      || $("focus").classList.contains("picking");
  }

  function update(fn) {
    const s = F.get();
    fn(s);
    F.set(s);
  }

  function setMinutes(m) {
    update(s => {
      s.minutes = m;
      s.state = "idle";
      delete s.endAt;
      delete s.remaining;
      delete s.finishAt;
    });
    settingsSet({ timerMode: "duration" });
    renderSettings();
  }

  function start() {
    const set = settingsGet();
    if (set.ambienceAuto && !S.current()) S.play();
    update(s => {
      // A finish time (from the settings) ends the countdown at that time
      const until = s.finishAt && s.finishAt > Date.now()
        ? s.finishAt - Date.now() : null;
      const left = s.state === "paused" ? s.remaining
        : until !== null ? until : s.minutes * 60000;
      delete s.finishAt;
      if (s.state !== "paused") s.total = left;
      s.state = "running";
      s.endAt = Date.now() + left;
      delete s.remaining;
      s.alerted = false;
      s.bannerOff = false;
    });
  }

  function pause() {
    update(s => {
      s.remaining = Math.max(0, s.endAt - Date.now());
      s.state = "paused";
      delete s.endAt;
    });
  }

  // Reset stops the countdown and returns it to the chosen time
  function reset() {
    update(s => {
      s.state = "idle";
      delete s.endAt;
      delete s.remaining;
      delete s.total;
      s.bannerOff = true;
    });
  }

  // Add time while counting down, or start again after 0
  function addTime(m) {
    const ms = m * 60000;
    update(s => {
      if (s.state === "running") {
        s.endAt += ms;
        s.total = (s.total || s.minutes * 60000) + ms;
      } else if (s.state === "paused") {
        s.remaining += ms;
        s.total = (s.total || s.minutes * 60000) + ms;
      } else {
        s.state = "running";
        s.endAt = Date.now() + ms;
        s.total = ms;
        s.alerted = false;
        s.bannerOff = true;
      }
    });
  }

  $("switch").addEventListener("click", () => {
    F.set({ state: "idle" });
    finishedFor = null;
    render();
  });

  // ---- Cheer and leaving ----

  function backTarget() {
    const from = F.from();
    if (from && !/\/focus\//.test(from)) return from;
    return "../to-dos/index.html#dates";
  }

  // Cheers come from a shuffled bag, so none repeats until all are used
  const CHEER_KEY = "focus-cheer-bag";
  function nextCheer() {
    let bag = [];
    try { bag = JSON.parse(read(CHEER_KEY)) || []; } catch {}
    bag = bag.filter(k => k >= 0 && k < CHEERS.length);
    if (!bag.length) {
      const last = +(read("focus-cheer-last") ?? -1);
      bag = CHEERS.map((_, k) => k);
      for (let k = bag.length - 1; k > 0; k--) {
        const r = Math.floor(Math.random() * (k + 1));
        [bag[k], bag[r]] = [bag[r], bag[k]];
      }
      if (bag[0] === last && bag.length > 1) bag.push(bag.shift());
    }
    const k = bag.shift();
    store(CHEER_KEY, JSON.stringify(bag));
    store("focus-cheer-last", String(k));
    return CHEERS[k];
  }

  function leave() {
    location.href = backTarget();
  }
  $("leave").addEventListener("click", leave);
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape" || e.defaultPrevented) return;
    const a = document.activeElement;
    if (a && a.tagName === "INPUT" && a.type !== "checkbox" && a.value) {
      a.blur();
      return;
    }
    leave();
  });

  // ---- Start ----

  // Width and size are shared with every page
  function applyShared() {
    const w = read("toolkit-width"), z = read("toolkit-size");
    app.classList.remove("width-normal", "width-wide", "width-full",
      "size-s", "size-m", "size-l");
    app.classList.add("width-" + (["normal", "wide", "full"].includes(w)
      ? w : "normal"), "size-" + (["s", "m", "l"].includes(z) ? z : "m"));
  }
  applyShared();
  window.addEventListener("storage", e => {
    if (e.key === "toolkit-width" || e.key === "toolkit-size") applyShared();
  });

  // The settings sidebar folds separately while picking and while
  // focusing; focusing starts folded until it's opened
  function sideFoldKey() {
    return "focus-settings-folded"
      + (document.body.classList.contains("focus-bare") ? "-focusing" : "");
  }
  function applySideFold() {
    const side = document.getElementById("settings");
    if (!side) return;
    const v = read(sideFoldKey());
    side.classList.toggle("folded",
      document.body.classList.contains("focus-bare") ? v !== "0" : v === "1");
  }

  // ---- Settings sidebar ----
  //
  // Timer (a duration, or a time to finish at), chime and ambience.
  // Kept on this device in "focus-settings"; the chime is played by the
  // sidebar wherever the timer runs out, and ambience by sounds.js.

  const SET_KEY = "focus-settings";
  const CHIME_NAMES = ["chime", "ding", "sparkle", "soft"];
  const S = window.ToolkitSounds;

  function settingsGet() {
    try { return JSON.parse(read(SET_KEY)) || {}; } catch { return {}; }
  }
  function settingsSet(patch) {
    store(SET_KEY, JSON.stringify(Object.assign(settingsGet(), patch)));
  }

  // "1:30" → 90; "45" → 45 minutes; null if it isn't a time
  function parseHM(text) {
    const m = String(text).trim().match(/^(\d{1,2}):(\d{2})$|^(\d{1,3})$/);
    if (!m) return null;
    if (m[3] !== undefined) return +m[3];
    if (+m[2] > 59) return null;
    return +m[1] * 60 + +m[2];
  }
  const hm = mins => Math.floor(mins / 60) + ":" + String(mins % 60).padStart(2, "0");

  function timerMode() {
    return settingsGet().timerMode === "time" ? "time" : "duration";
  }

  function renderTimerInput() {
    const s = F.get(), input = $("timer-input");
    if (timerMode() === "time") {
      input.value = s.finishAt && s.finishAt > Date.now()
        ? new Date(s.finishAt).toTimeString().slice(0, 5)
        : settingsGet().finishAt || "";
    } else {
      input.value = hm(s.state === "idle" ? s.minutes || 10
        : Math.ceil(F.left(s) / 60000));
    }
  }

  function note(text, error) {
    $("timer-note").textContent = text || "";
    $("timer-note").classList.toggle("error", !!error);
  }

  // Apply the typed timer: to a running timer straight away, or to the
  // next countdown when idle
  function applyTimer() {
    const mode = timerMode(), mins = parseHM($("timer-input").value);
    if (mins === null) {
      note(mode === "time" ? "type a time as hh:mm, e.g. 15:30"
        : "type a duration as hh:mm, e.g. 0:25", true);
      return;
    }
    let ms;
    if (mode === "time") {
      if (mins >= 24 * 60) return note("type a time between 0:00 and 23:59", true);
      const at = new Date();
      at.setHours(Math.floor(mins / 60), mins % 60, 0, 0);
      if (+at <= Date.now()) return note("that time has already passed", true);
      ms = +at - Date.now();
      settingsSet({ finishAt: hm(mins).padStart(5, "0") });
      update(s => {
        if (s.state === "running") { s.endAt = +at; s.total = ms; }
        else if (s.state === "paused") { s.remaining = ms; s.total = ms; }
        else { s.minutes = Math.ceil(ms / 60000); s.finishAt = +at; }
      });
      note("finishes at " + at.toTimeString().slice(0, 5));
    } else {
      if (mins < 1) return note("a duration needs at least 1 minute", true);
      ms = mins * 60000;
      update(s => {
        delete s.finishAt;
        if (s.state === "running") { s.endAt = Date.now() + ms; s.total = ms; }
        else if (s.state === "paused") { s.remaining = ms; s.total = ms; }
        else s.minutes = mins;
      });
      note("");
    }
    renderClock(F.get(), true);
  }

  $("timer-input").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); applyTimer(); }
  });
  $("timer-input").addEventListener("change", applyTimer);
  document.querySelectorAll(".set-opt[data-mode]").forEach(b => {
    b.addEventListener("click", () => {
      settingsSet({ timerMode: b.dataset.mode });
      if (b.dataset.mode === "duration") update(s => { delete s.finishAt; });
      note("");
      renderSettings();
      $("timer-input").focus();
    });
  });

  function optionButton(box, name, pressed, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "set-opt";
    b.textContent = name;
    b.setAttribute("aria-pressed", String(pressed));
    b.addEventListener("click", onClick);
    box.appendChild(b);
  }

  function renderSettings() {
    const set = settingsGet(), mode = timerMode();
    document.querySelectorAll(".set-opt[data-mode]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    $("timer-label").textContent = mode === "time"
      ? "finish at (hh:mm)" : "duration (hh:mm)";
    $("timer-input").placeholder = mode === "time" ? "15:30" : "0:25";
    if (document.activeElement !== $("timer-input")) renderTimerInput();

    // Chime: clicking one chooses and plays it
    const chimeBox = $("chime-options"), chosen = CHIME_NAMES.includes(set.chime)
      ? set.chime : "chime";
    chimeBox.innerHTML = "";
    CHIME_NAMES.forEach(name => optionButton(chimeBox, name, name === chosen, () => {
      settingsSet({ chime: name });
      F.chime(name);
      renderSettings();
    }));
    $("chime-volume").value = Math.round((Number.isFinite(set.chimeVolume)
      ? set.chimeVolume : 0.7) * 100);

    // Ambience: one at a time; clicking the playing one stops it
    const ambBox = $("ambience-options"), playing = S.current();
    ambBox.innerHTML = "";
    S.names.forEach(name => optionButton(ambBox, S.label(name), name === playing, () => {
      if (S.current() === name) S.stopAmbience();
      else S.play(name);
    }));
    $("ambience-volume").value = Math.round((Number.isFinite(set.ambienceVolume)
      ? set.ambienceVolume : 0.5) * 100);
    $("ambience-auto").setAttribute("aria-pressed", String(!!set.ambienceAuto));
  }

  // With the timer: starting the countdown starts the last ambience
  $("ambience-auto").addEventListener("click", () => {
    settingsSet({ ambienceAuto: !settingsGet().ambienceAuto });
    renderSettings();
  });

  // Chime volume: the chime plays again once the slider is let go
  $("chime-volume").addEventListener("change", e => {
    const v = e.target.value / 100;
    settingsSet({ chimeVolume: v });
    F.chime(undefined, v);
  });
  // Ambience volume changes as the slider moves
  $("ambience-volume").addEventListener("input", e => {
    const v = e.target.value / 100;
    settingsSet({ ambienceVolume: v });
    S.setVolume(v);
  });
  S.onChange(renderSettings);
  // Stop listening once this page leaves the shell's frame
  window.addEventListener("pagehide", () => {
    if (S.offChange) S.offChange(renderSettings);
  });

  // Groups open and close with their +/−; remembered on this device
  const GROUPS_KEY = "focus-settings-groups";
  let closedGroups = {};
  try { closedGroups = JSON.parse(read(GROUPS_KEY)) || {}; } catch {}
  document.querySelectorAll(".set-group").forEach(g => {
    const head = g.querySelector(".set-head");
    const show = open => {
      g.classList.toggle("closed", !open);
      head.setAttribute("aria-expanded", String(open));
      head.querySelector(".set-sign").textContent = open ? "−" : "+";
    };
    show(!closedGroups[g.dataset.group]);
    head.addEventListener("click", () => {
      const open = g.classList.contains("closed");
      show(open);
      closedGroups[g.dataset.group] = !open;
      store(GROUPS_KEY, JSON.stringify(closedGroups));
    });
  });

  // Resize and fold, as on the dashboard
  const aside = $("settings"), sideWrap = $("settings-wrap");
  const SIDE_KEY = "focus-settings-width";
  const sideWidth = w => Math.max(240, Math.min(520, Math.round(w)));
  const savedWidth = parseInt(read(SIDE_KEY));
  if (savedWidth) aside.style.flexBasis = sideWidth(savedWidth) + "px";
  applySideFold();
  const setFolded = folded => {
    aside.classList.toggle("folded", folded);
    store(sideFoldKey(), folded ? "1" : "0");
  };
  $("fold").addEventListener("click", () => setFolded(true));
  aside.querySelector(".unfold").addEventListener("click", () => setFolded(false));
  sideWrap.querySelector(".aside-handle").addEventListener("pointerdown", e => {
    if (e.button !== 0 || aside.classList.contains("folded")) return;
    e.preventDefault();
    const right = sideWrap.getBoundingClientRect().right;
    aside.classList.add("dragging");
    sideWrap.classList.add("resizing");
    document.body.style.cursor = "col-resize";
    const move = ev => {
      aside.style.flexBasis = sideWidth(right - ev.clientX) + "px";
    };
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      aside.classList.remove("dragging");
      sideWrap.classList.remove("resizing");
      document.body.style.cursor = "";
      store(SIDE_KEY, parseInt(aside.style.flexBasis));
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });

  ToolkitSidebar.init({
    active: "focus",
    focusPage: true,
    mode: {
      apply: (m, anim) => {
        if (anim) {
          app.classList.add("theme-anim");
          setTimeout(() => app.classList.remove("theme-anim"), 300);
        }
        app.classList.toggle("t-dark", m !== "light");
        app.classList.toggle("t-light", m === "light");
      },
      initial: "dark"
    },
    page: "focus/index.html",
    size: {
      get: () => ["s", "m", "l"].includes(read("toolkit-size"))
        ? read("toolkit-size") : "m",
      set: v => { store("toolkit-size", v); applyShared(); }
    },
    width: {
      get: () => ["normal", "wide", "full"].includes(read("toolkit-width"))
        ? read("toolkit-width") : "normal",
      set: v => { store("toolkit-width", v); applyShared(); }
    }
  });

  render();
  F.onTick(s => renderClock(s));
  renderSettings();
  F.onTick(() => {
    if (document.activeElement !== $("timer-input")) renderTimerInput();
  });

  // Refresh relative task tokens after local midnight.
  let relativeDate = new Date().toDateString();
  setInterval(() => {
    const today = new Date().toDateString();
    const active = document.activeElement;
    if (today !== relativeDate && !document.querySelector(".orbita-date-picker")
        && !(active && (active.tagName === "INPUT"
          || active.tagName === "TEXTAREA" || active.isContentEditable))) {
      relativeDate = today;
      render();
    }
    const s = F.get();
    if (s.state === "running") renderClock(s);
  }, 250);

  // Keep up with edits in other tabs, unless typing here
  window.addEventListener("storage", e => {
    if (![TODO_KEY, NOTES_KEY, "focus-state"].includes(e.key)) return;
    const a = document.activeElement;
    if (a && a.tagName === "INPUT" && a.type !== "checkbox"
      && a.id !== "pick-input") return;
    if (a === $("focal-text")) return;
    render();
  });

  // The squish on every button is shared (sidebar.js)

  ToolSync.init({
    file:     "to-dos.json",
    keys:     [TODO_KEY, "todo-toggle-sections"],
    onRemote: render
  });
  ToolSync.init({
    file:     "notes.json",
    keys:     [NOTES_KEY],
    onRemote: render
  });
})();
</script>
</body>
</html>
