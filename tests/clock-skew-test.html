<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock skew sync test</title>
<h1>Clock skew sync test</h1>
<p>This test uses fake Drive responses, a simulated device clock, and temporary
localStorage keys. It does not contact Google Drive or change toolkit records.</p>
<button id="run" type="button">Run test</button>
<pre id="result" role="status" aria-live="polite">Ready.</pre>
<script>
  window.__syncTestNativeSet = Storage.prototype.setItem;
  window.__syncTestNativeRemove = Storage.prototype.removeItem;
  window.__syncTestNativeNow = Date.now;
  window.__syncTestClockOffset = 0;
  Date.now = () => window.__syncTestNativeNow.call(Date)
    + window.__syncTestClockOffset;
  window.setInterval = () => 0;
  const appendHead = HTMLHeadElement.prototype.appendChild;
  HTMLHeadElement.prototype.appendChild = function (node) {
    if (node.tagName === "SCRIPT"
        && node.src.includes("accounts.google.com/gsi/client")) return node;
    return appendHead.call(this, node);
  };
</script>
<script src="../sync.js"></script>
<script src="clock-skew-test.js"></script>
